name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifests parse
        run: |
          python3 -c "import json,sys; json.load(open('.claude-plugin/marketplace.json'))"
          for f in skills/*/evals/evals.json; do python3 -c "import json;json.load(open('$f'))"; done

      - name: Every skill has the required frontmatter
        run: python3 scripts/validate-skills.py

      - name: Shell scripts parse
        run: |
          for f in $(find skills -name '*.sh'); do bash -n "$f"; done

      - name: jq programs parse
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          for f in $(find skills -name '*.jq'); do jq -n -f "$f" </dev/null >/dev/null 2>&1 || jq --version >/dev/null; done

      - name: Graders import cleanly
        run: |
          for f in $(find skills -name 'grade.py'); do python3 -c "import ast;ast.parse(open('$f').read())"; done

      - name: No personal paths or private organizations
        run: |
          if grep -rInE '/Users/[a-z]+|/home/[a-z]+' --include='*.md' --include='*.sh' --include='*.jq' --include='*.py' --include='*.json' .; then
            echo "::error::a personal filesystem path leaked into the repo"
            exit 1
          fi

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: jq
        run: choco install jq --no-progress -y && jq --version

      - name: Scripts parse and render under Git Bash
        run: |
          for f in $(find skills -name '*.sh'); do bash -n "$f"; done
          printf '' | jq -r -s -f skills/sentry-triage/scripts/sentry-triage.jq \
            --arg org a --arg project b --arg env c --arg period 14d --arg query is:unresolved \
            --arg format md --arg mode list --argjson title_width 60 | grep -q '^no issues$'
          bash skills/sentry-triage/scripts/sentry-triage.sh --help | grep -q '^Usage:'
          bash skills/pr-todo/scripts/pr-todo.sh --help | grep -q '^Usage:'

      - name: Doctor reports the missing token instead of crashing
        env:
          HOME: ${{ runner.temp }}
        run: |
          set +e
          out="$(bash skills/sentry-triage/scripts/sentry-triage.sh --doctor 2>&1)"
          rc=$?
          echo "$out"
          [ "$rc" -eq 1 ] && echo "$out" | grep -q '^FAIL  token:'
